<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="400" height="400" rx="200" fill="url(#avatarBg)" />

  <!-- Subtle glow inner circle -->
  <circle cx="200" cy="200" r="192" fill="none" stroke="url(#ringGlow)" stroke-width="4" opacity="0.6" />

  <!-- Stylized Silhouette Character -->
  <g filter="url(#softShadow)">
    <!-- Head -->
    <circle cx="200" cy="155" r="65" fill="#f8fafc" />
    <!-- Hair overlay modern -->
    <path d="M 140 160 C 140 100, 260 100, 260 160 C 255 125, 230 115, 200 115 C 165 115, 145 130, 140 160 Z" fill="#0f172a" />
    <!-- Body / Shoulders -->
    <path d="M 90 350 C 90 260, 140 235, 200 235 C 260 235, 310 260, 310 350 Z" fill="#f8fafc" />
    <!-- Inner Collar detail -->
    <path d="M 175 235 L 200 270 L 225 235 Z" fill="#e2e8f0" />
  </g>

  <!-- Camera / Add Photo Badge Icon in Corner -->
  <g transform="translate(270, 270)">
    <circle cx="45" cy="45" r="40" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
    <circle cx="45" cy="45" r="32" fill="#3b82f6" />
    <path d="M35 52 L35 44 C35 42 37 40 39 40 L42 40 L44 37 L50 37 L52 40 L55 40 C57 40 59 42 59 44 L59 52 C59 54 57 56 55 56 L39 56 C37 56 35 54 35 52 Z" fill="#ffffff" />
    <circle cx="47" cy="48" r="4.5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" />
  </g>
</svg>

